[project]
name = "jev-test"
version = "0.1.0"
description = "Pre-registered benchmark: can a small local model do trustworthy web search-and-answer when a decision model (Jev) makes every call? Gemma 4 E2B + Jev + SearXNG + MemPalace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "trafilatura>=1.9",        # page text extraction for fetched search results
  "tiktoken>=0.7",           # token counting for chunk and evidence caps
  "mempalace>=0.9",          # verbatim memory; ChromaDB backend by default
]

[project.optional-dependencies]
# Arm D. typesafe-sdk is served from TypeSafe's own index:
#   uv pip install --extra-index-url https://pypi.typesafe.ai/ "typesafe-sdk>=0.5.7"
jev = ["typesafe-sdk>=0.5.7"]
# Arm C-self: the official adapter that answers the same questions with any OpenAI-compatible LLM.
self = ["system-one-adapter[openai]>=0.2.0"]
# Arm C-laya: open local decision model (Apache 2.0).
laya = ["laya"]
# Arm C-classical.
classical = ["sentence-transformers>=3.0", "transformers>=4.44", "torch>=2.3"]
# Grading and the Space.
grading = ["openai>=1.40"]      # any OpenAI-compatible gateway, e.g. LiteLLM, for the frontier grader
space = ["gradio>=4.40", "pandas>=2.2", "matplotlib>=3.9"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv]
# TypeSafe publishes typesafe-sdk on its own index; keep PyPI as the primary.
extra-index-url = ["https://pypi.typesafe.ai/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
